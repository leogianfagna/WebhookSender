<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aaa Mensagem para Discord</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/new/style.css">
</head>

<body class="vh-100">
    <div class="h-100">
        <div class="row h-100 g-0">

            <div id="horizontal-nav" class="col-3 d-flex flex-column justify-content-center text-center p-5">
                <p>Coluna 1</p>
                <button type="submit" class="btn btn-primary card-submit-button mb-3"
                    onclick="filtrarKartodromo(this);">Aviso de eventos</button>
                <button type="submit" class="btn btn-primary card-submit-button mb-3"
                    onclick="filtrarKartodromo(this);">Status do servidor</button>
                <button type="submit" class="btn btn-primary card-submit-button mb-3"
                    onclick="filtrarKartodromo(this);">Patch Notes</button>
            </div>

            <div id="main-content" class="col-9 d-flex flex-column justify-content-center text-center p-5">
                <p>Coluna 2</p>

                <form>
                    <p>Adição de itens</p>
                    <div class="row g-3 mb-3">
                        <div class="col">
                            <input type="number" class="form-control" placeholder="Versão da atualização" id="version">
                        </div>
                        <div class="col">
                            <select class="form-select" id="server">
                                <option value="0" selected>Servidor</option>
                                <option value="Henesys">Henesys</option>
                                <option value="Vanillew">Vanillew</option>
                                <option value="Skyten">Skyten</option>
                                <option value="Ausevento">Ausevento</option>
                                <option value="Lobby">Lobby</option>
                                <option value="Rede">Rede</option>
                            </select>
                        </div>
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Webhook URL" id="url">
                        </div>

                    </div>
                    <div class="col mb-3">
                        <label for="patch" class="form-label">Example textarea</label>
                        <textarea class="form-control" id="patch" rows="3" placeholder="Descrição do patch"></textarea>
                    </div>
                    <button type="button" onclick="sendWebhook();">Enviar</button>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="/new/script.js"></script>
</body>

</html>
