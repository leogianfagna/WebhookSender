<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Full Height Columns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .col-8 {
            background-color: lightblue;
        }

        .col-4 {
            background-color: lightgreen;
        }
    </style>
</head>

<!-- A classe vh-100 define a altura do elemento como 100% da altura da viewport (altura visível da janela do navegador) -->
<body class="vh-100">

    <!-- Define a mesma altura total do elemento pai, ou seja, preencherá 100% da altura definida pelo <body> -->
    <div class="h-100">

        <!-- 
            row: Define a estrutura como uma linha flexível do grid, para alinhar colunas horizontalmente
            h-100: Define que a linha terá 100% da altura disponível no elemento pai
            g-0: Remove o espaçamento padrão (gutter) entre as colunas. Isso resolve barra horizontal sendo criada
        -->
        <div class="row h-100 g-0">

            <!-- Coluna 1 -->
            <!-- Aplica o comportamento flexível ao contêiner com d-flex e organiza os elementos filhos da coluna em um eixo vertical -->
            <div class="col-8 d-flex flex-column justify-content-center text-center">
                <p>Coluna 1</p>
            </div>

            <!-- Coluna 2 -->
            <div class="col-4 d-flex flex-column justify-content-center text-center">
                <p>Coluna 2</p>
            </div>

        </div>
    </div>
</body>

</html>
